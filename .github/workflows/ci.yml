---
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:

  tests:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      # To avoid this error: "The headers or library files could not be found for jpeg, a required dependency when compiling Pillow from source."
      # And an error on BLAS.
      - name: Install system dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y libjpeg-dev zlib1g-dev libopenblas-dev pkg-config

      - name: Install python dependencies
        run: uv sync --locked --dev

      - name: Run tests
        run: uv run pytest -m "not slowest" tests/

